
<!DOCTYPE html>
<html lang="ha">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>m3ugen</title>
    <link rel="stylesheet" href="https://bootswatch.com/5/flatly/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastify-js/1.12.0/toastify.min.css" integrity="sha512-k+xZuzf4IaGQK9sSDjaNyrfwgxBfoF++7u6Q0ZVUs2rDczx9doNZkYXyyQbnJQcMR4o+IjvAcIj69hHxiOZEig==" crossorigin="anonymous" referrerpolicy="no-referrer">

    <style>
        #loading {
            background: rgba(0, 0, 0, .5);
            z-index: 10000;
        }

        .ellipsis-text {
            white-space: nowrap;          /* 折り返しを禁止 */
            overflow: hidden;             /* はみ出た部分を非表示にする */
            text-overflow: ellipsis;      /* はみ出た部分を「…」にする */
        }

        .star-toggle input {
            display: none; /* チェックボックス本体は隠す */
        }
        
        .star-toggle .star-filled {
            display: none;
        }
        
        .star-toggle input:checked ~ .star-outline {
            display: none;
        }
        
        .star-toggle input:checked ~ .star-filled {
            display: inline-block;
        }

        .hide {
            display: none;
        }
    </style>

  </head>
  <body>

    <div class="navbar navbar-expand-lg fixed-top bg-primary" data-bs-theme="dark">
        <div class="container">
            <a href="./index.html" class="navbar-brand">m3ugen</a>

            <div class="d-flex gap-2">
                <button id="reload-btn" type="button" class="btn btn-outline-light">再読み込み</button>
                <button type="button" class="btn btn-outline-light" data-bs-toggle="modal" data-bs-target="#selectModal">プレイリスト作成</button>
            </div>
        </div>
    </div>
    
    <div id="loading" class="top-0 start-0 w-100 h-100" style="position: fixed;">
        <div class="text-center position-absolute top-50 start-50 w-100 translate-middle">
            <div class="spinner-border text-light" role="status">
                <span class="sr-only"></span>
            </div>
        </div>
    </div>

    <div class="container" style="margin-top: 100px;">
        <div class="row row-cols-1">
            <div style="padding: 20px;">
                <label for="filter-select" class="form-label mt-4">フィルタリング</label>
                <select class="form-select" id="filter-select">
                </select>
            </div>
        </div>

        <div class="row row-cols-1" id="container">

        </div>
    </div>

    <div class="modal fade" id="selectModal" tabindex="-1" aria-labelledby="selectModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="selectModalLabel">プレイリスト作成</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="閉じる"></button>
                </div>
                
                <div class="modal-body">
                    <label for="target-select" class="form-label">対象を選んでください</label>
                    <select class="form-select" id="target-select" aria-label="対象選択">
                    </select>
                </div>
                <div class="modal-footer">
                    <button id="create-btn" type="button" class="btn btn-primary" data-bs-dismiss="modal">作成</button>
                </div>
            </div>
        </div>
    </div>


    <script id="view-template" type="text/x-handlebars-template">
        
            <div class="list-group">
                {{#each this}}
                
                 <a  class="music {{key}} list-group-item list-group-item-action flex-column align-items-start">
                    <div class="d-flex w-100 align-items-center">
                        <img src="{{image}}" alt="サムネイル" class="rounded me-3" style="width: 64px; height: 64px; object-fit: cover; flex-shrink: 0;">
                        <div class="w-100">
                            <div class="d-flex w-100 justify-content-between">
                                <h5 class="mb-1">{{title}}</h5>
                            </div>
                            <small class="text-muted">
                                <span class="badge bg-light">{{key}}</span>
                                <span class="badge bg-light">{{formatDuration duration}}</span>
                                <span class="badge bg-light">{{pub}}</span>
                            </small>
                        </div>

                        <label class="star-toggle flex-shrink-0 m-0" style="cursor: pointer;" title="お気に入り切り替え">
                            <input class="itemCheck" type="checkbox" data-json='{{stringify this}}'/>
                            <svg class="star-outline text-secondary" xmlns="http://w3.org" width="32" height="32" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M2.866 14.85c-.078.444.36.791.746.593l4.39-2.256 4.389 2.256c.386.198.824-.149.746-.592l-.83-4.73 3.522-3.356c.33-.314.16-.888-.282-.95l-4.898-.696L8.465.792a.513.513 0 0 0-.927 0L5.354 5.12l-4.898.696c-.441.062-.612.636-.283.95l3.523 3.356-.83 4.73zm4.905-2.767-3.686 1.894.694-3.957a.56.56 0 0 0-.163-.505L1.71 6.745l4.052-.576a.53.53 0 0 0 .393-.288L8 2.223l1.847 3.658a.53.53 0 0 0 .393.288l4.052.575-2.906 2.77a.56.56 0 0 0-.163.506l.694 3.957-3.686-1.894a.5.5 0 0 0-.461 0z"/>
                            </svg>
                            <svg class="star-filled text-warning" xmlns="http://w3.org" width="32" height="32" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M3.612 15.443c-.386.198-.824-.149-.746-.592l.83-4.73L.173 6.765c-.329-.314-.158-.888.283-.95l4.898-.696L7.538.792c.197-.39.73-.39.927 0l2.184 4.327 4.898.696c.441.062.612.636.282.95l-3.522 3.356.83 4.73c.078.443-.36.79-.746.592L8 13.187l-4.389 2.256z"/>
                            </svg>
                        </label>
                    </div>
                </a>
                {{/each}}

            </div>
    </script>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.8/handlebars.min.js" integrity="sha512-E1dSFxg+wsfJ4HKjutk/WaCzK7S2wv1POn1RRPGh8ZK+ag9l244Vqxji3r6wgz9YBf6+vhQEYJZpSjqWFPg9gg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.9/js/bootstrap.min.js" integrity="sha512-e4zOZ7FnTZI7kJRWkYI2JKl3+U1FbaFBGa6dOOO6uzKg78sRp48AqLVMpOPjezjoSn4M8RsrbBAvQclR3x7riA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastify-js/1.12.0/toastify.js" integrity="sha512-ZHzbWDQKpcZxIT9l5KhcnwQTidZFzwK/c7gpUUsFvGjEsxPusdUCyFxjjpc7e/Wj7vLhfMujNx7COwOmzbn+2w==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="application.js"></script>
  </body>
</html>
